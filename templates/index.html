<!DOCTYPE html>

<html>

<head>

<title>AI Cardiovascular Disease Screening</title>

<style>

body{
font-family:Arial;
margin:0;
background:linear-gradient(135deg,#355C7D,#6C5B7B,#C06C84);
color:white;
}

.header{
text-align:center;
padding:40px;
}

.header h1{
font-size:40px;
}

.images{
display:flex;
justify-content:center;
gap:30px;
margin-top:20px;
}

.images img{
width:160px;
height:160px;
object-fit:cover;
border-radius:12px;
box-shadow:0px 5px 20px rgba(0,0,0,0.4);
}

.container{
width:70%;
margin:auto;
background:white;
color:black;
padding:40px;
border-radius:12px;
box-shadow:0px 10px 30px rgba(0,0,0,0.2);
margin-top:30px;
margin-bottom:40px;
}

.section-title{
background:linear-gradient(45deg,#36D1DC,#5B86E5);
color:white;
padding:12px;
border-radius:6px;
margin-top:30px;
font-size:20px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
}

button{
margin-top:30px;
width:100%;
padding:15px;
background:linear-gradient(45deg,#ff512f,#dd2476);
border:none;
color:white;
font-size:18px;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

</style>

</head>

<body>

<div class="header">

<h1>AI Cardiovascular Disease Screening</h1>

<div class="images">

<img src="https://cdn-icons-png.flaticon.com/512/2966/2966480.png">
<img src="https://cdn-icons-png.flaticon.com/512/4320/4320371.png">
<img src="https://cdn-icons-png.flaticon.com/512/2920/2920277.png">

</div>

</div>

<div class="container">

<form action="/predict" method="post">

<div class="section-title">Basic Information</div>

<input name="age" placeholder="Age">
<input name="sex" placeholder="Sex (1 = Male, 0 = Female)">

<div class="section-title">Heart Disease Parameters</div>

<input name="cp" placeholder="Chest Pain Type">
<input name="trestbps" placeholder="Resting Blood Pressure">
<input name="chol" placeholder="Cholesterol">
<input name="fbs" placeholder="Fasting Blood Sugar">
<input name="restecg" placeholder="Rest ECG">
<input name="thalach" placeholder="Max Heart Rate">
<input name="exang" placeholder="Exercise Angina">
<input name="oldpeak" placeholder="Oldpeak">
<input name="slope" placeholder="Slope">
<input name="ca" placeholder="CA">
<input name="thal" placeholder="Thal">

<div class="section-title">Heart Failure Parameters</div>

<input name="anaemia" placeholder="Anaemia (0/1)">
<input name="creatinine_phosphokinase" placeholder="Creatinine Phosphokinase">
<input name="diabetes" placeholder="Diabetes (0/1)">
<input name="ejection_fraction" placeholder="Ejection Fraction">
<input name="high_blood_pressure" placeholder="High Blood Pressure (0/1)">
<input name="platelets" placeholder="Platelets">
<input name="serum_creatinine" placeholder="Serum Creatinine">
<input name="serum_sodium" placeholder="Serum Sodium">
<input name="smoking" placeholder="Smoking (0/1)">
<input name="time" placeholder="Follow-up Time">

<button>Analyze Cardiovascular Risk</button>

</form>

</div>

</body>

</html>
